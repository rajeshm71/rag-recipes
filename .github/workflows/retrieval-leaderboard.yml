name: Retrieval leaderboard

# Re-computes outputs/retrieval_leaderboard.md with the local embedding and
# reranker models (no API key) and fails if the committed table, or the copy
# embedded in the README, differs from a fresh run. The cross-encoder makes
# this a long CPU job, so it runs only when something that can change the
# table changes, and on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - corpus/corpus.jsonl
      - evals/qa_set.jsonl
      - evals/retrieval_leaderboard.py
      - evals/metrics.py
      - evals/run.py
      - recipes/bm25.py
      - recipes/dense_index.py
      - recipes/embeddings.py
      - recipes/hybrid.py
      - recipes/rerank.py
      - recipes/store.py
      - outputs/retrieval_leaderboard.md
      - README.md
      - pyproject.toml
      - uv.lock
      - .github/workflows/retrieval-leaderboard.yml
  pull_request:
    paths:
      - corpus/corpus.jsonl
      - evals/qa_set.jsonl
      - evals/retrieval_leaderboard.py
      - evals/metrics.py
      - evals/run.py
      - recipes/bm25.py
      - recipes/dense_index.py
      - recipes/embeddings.py
      - recipes/hybrid.py
      - recipes/rerank.py
      - recipes/store.py
      - outputs/retrieval_leaderboard.md
      - README.md
      - pyproject.toml
      - uv.lock
      - .github/workflows/retrieval-leaderboard.yml
  workflow_dispatch:

jobs:
  retrieval-leaderboard:
    runs-on: ubuntu-latest
    # The cross-encoder scores about 1,700 question/chunk pairs on CPU; a run
    # has taken from about 75 minutes to over 120 depending on the runner.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Restore HuggingFace models
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-bge-small-en-v1.5-bge-reranker-v2-m3
      - name: Download models
        run: >-
          uv run python -c "from sentence_transformers import CrossEncoder, SentenceTransformer;
          SentenceTransformer('BAAI/bge-small-en-v1.5'); CrossEncoder('BAAI/bge-reranker-v2-m3')"
      # Saved right after the download, so a later failure or timeout in the
      # check does not force the next run to download the models again.
      - name: Save HuggingFace models
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-bge-small-en-v1.5-bge-reranker-v2-m3
        continue-on-error: true
      - run: uv run python evals/retrieval_leaderboard.py --check
