[project]
name = "rag-recipes"
version = "0.1.0"
description = "10 RAG patterns as runnable notebooks, benchmarked on the same corpus and eval set."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.50",
    "sqlite-vec>=0.1.3",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "anthropic>=0.121",
    "requests>=2.31",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Only needed to rebuild corpus/corpus.jsonl from scratch. Not required to run
# the pattern notebooks, so kept out of the default `uv sync` install.
# requests is NOT listed here -- it's a main dependency instead (needed by
# recipes/embeddings.py's VoyageEmbedder, a REST call, not the voyageai
# SDK -- see that module's docstring for why).
corpus-build = [
    "pypdf>=4.0",
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "papermill>=2.6",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recipes", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001 (blind except) is intentionally NOT enforced: this project uses
# broad `except Exception` deliberately and consistently as a resilience
# policy -- evals/run.py's per-question error isolation, and every
# recipes/*.py defensive JSON parser (multi_query/self_query/multi_hop/
# agentic's `_parse_*` functions) -- "any single failure degrades
# gracefully rather than crashing the whole run." See CLAUDE.md's
# Anti-Patterns section and the individual `# noqa: BLE001` comments this
# rule replaces in evals/run.py. Everything else stays at ruff's default
# selection.
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
